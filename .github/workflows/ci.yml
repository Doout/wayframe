name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Install Rust toolchain components
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/wayframe-rustup"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup show active-toolchain
      - name: Verify source, libraries, optional plugins, and live gateway
        run: bash scripts/verify.sh
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-${{ runner.os }}-1.261.0
      - name: Build and execute Rust guest component
        run: |
          if ! command -v wasm-tools >/dev/null; then cargo install wasm-tools --version 1.261.0 --locked; fi
          bash scripts/build-wasm-guest.sh
          python3 scripts/smoke.py --wasm --plugin-manifest target/path-control/plugin.toml > target/verification/rust-guest-smoke.json
      - name: Check benchmark harness
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/benchmark.sh --requests 100 --rounds 1 --concurrency 1 --payloads 64 --formats json --native-only --skip-boundaries
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.os }}
          path: |
            target/verification/
            target/benchmarks/
