[workspace]
resolver = "2"
members = [
  "crates/wayframe", "crates/wayframe-core", "crates/wayframe-runtime",
  "crates/wayframe-http", "crates/wayframe-blocks", "crates/wayframe-transport",
  "crates/wayframe-mcp", "crates/wayframe-lb", "crates/wayframe-wasm", "crates/wayframe-flow", "crates/wayframe-management", "crates/wayframe-listeners", "crates/wayframe-codec", "crates/wayframe-plugins", "crates/wayframe-routing", "crates/wayframe-resilience", "crates/wayframe-auth", "crates/wayframe-observability", "crates/wayframe-cache", "examples/mcp-gateway", "crates/wayframe-policies",
]
default-members = ["crates/wayframe", "crates/wayframe-core", "crates/wayframe-runtime"]
exclude = ["plugins/path-control"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/doout/wayframe"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1"
crossbeam-queue = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
http = "1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs", "signal", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tracing = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "http-json", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = "0.34"
rand = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Wasm is disabled by default; keep the runtime and component ABI compatible.
wasmtime = { version = "=49.0.2", default-features = false, features = ["anyhow", "async", "component-model", "cranelift", "pooling-allocator", "runtime", "std", "wat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
