[package]
name = "wayframe-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wayframe-core = { path = "../wayframe-core" }
wayframe-codec = { path = "../wayframe-codec", features=["http"] }
wayframe-runtime = { path = "../wayframe-runtime", features = ["tracing"] }
anyhow.workspace = true
http.workspace = true
bytes.workspace = true
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
async-stream.workspace = true
futures-util.workspace = true
serde_json.workspace = true
http-body = "1"
http-body-util = "0.1"

tracing.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

wayframe-lb = { path = "../wayframe-lb", optional = true }
wayframe-routing = { path = "../wayframe-routing", optional = true }
wayframe-flow = { path = "../wayframe-flow", optional = true }

[features]
lb = ["dep:wayframe-lb", "wayframe-lb/tracing"]
routing = ["dep:wayframe-routing", "lb"]
flow = ["dep:wayframe-flow"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]

[dev-dependencies]
wayframe-listeners = { path = "../wayframe-listeners" }
hyper = { version = "1", features=["client", "http2"] }
hyper-util = { version = "0.1",features=["tokio"] }
