[package]
name = "wayframe-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wayframe-core = { path = "../wayframe-core" }
wayframe-runtime = { path = "../wayframe-runtime", features = ["tracing"] }
anyhow.workspace = true
http.workspace = true
bytes.workspace = true
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
async-stream.workspace = true
futures-util.workspace = true
serde_json.workspace = true

tracing.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

wayframe-lb = { path = "../wayframe-lb", optional = true }

[features]
lb = ["dep:wayframe-lb", "wayframe-lb/tracing"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
