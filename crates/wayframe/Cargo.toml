[package]
name = "wayframe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wayframe-core = { path = "../wayframe-core" }
wayframe-flow = { path = "../wayframe-flow", optional = true }
wayframe-cache = { path = "../wayframe-cache", optional = true }
wayframe-observability = { path = "../wayframe-observability", optional = true }
wayframe-auth = { path = "../wayframe-auth", optional = true }
wayframe-routing = { path = "../wayframe-routing", optional = true }
wayframe-resilience = { path = "../wayframe-resilience", optional = true }
wayframe-plugins = { path = "../wayframe-plugins", optional = true }
wayframe-codec = { path = "../wayframe-codec", optional = true }
wayframe-listeners = { path = "../wayframe-listeners", optional = true }
wayframe-management = { path = "../wayframe-management", optional = true }
wayframe-runtime = { path = "../wayframe-runtime" }
wayframe-http = { path = "../wayframe-http", optional = true }
wayframe-blocks = { path = "../wayframe-blocks", optional = true }
wayframe-transport = { path = "../wayframe-transport", optional = true }
wayframe-mcp = { path = "../wayframe-mcp", optional = true }
wayframe-wasm = { path = "../wayframe-wasm", optional = true }

wayframe-lb = { path = "../wayframe-lb", optional = true }

wayframe-policies = { path = "../wayframe-policies", optional = true }

[features]
default = []
policies = ["dep:wayframe-policies", "plugins", "http"]
flow = ["dep:wayframe-flow", "wayframe-http?/flow"]
cache = ["dep:wayframe-cache"]
observability = ["otel", "dep:wayframe-observability", "wayframe-observability/otel"]
auth = ["http", "dep:wayframe-auth"]
routing = ["dep:wayframe-routing", "wayframe-http?/routing"]
resilience = ["dep:wayframe-resilience"]
plugins = ["dep:wayframe-plugins"]
codec = ["dep:wayframe-codec"]
listeners = ["dep:wayframe-listeners"]
management = ["http", "mcp", "dep:wayframe-management"]
http = ["dep:wayframe-http"]
lb = ["dep:wayframe-lb", "wayframe-http?/lb"]
otel = ["http", "wayframe-http/otel"]
controls = ["http", "dep:wayframe-blocks"]
transport = ["http", "dep:wayframe-transport"]
mcp = ["http", "dep:wayframe-mcp"]
wasm = ["http", "dep:wayframe-wasm"]

[dev-dependencies]
http.workspace = true
tokio.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-util.workspace = true

[[example]]
name = "policy_cost"
required-features = ["http", "transport", "wasm"]

[[example]]
name = "lb_cost"
required-features = ["lb"]

[[example]]
name = "flow_cost"
required-features = ["flow"]

[[example]]
name = "boundary_fuzz"
required-features = ["mcp", "codec"]
