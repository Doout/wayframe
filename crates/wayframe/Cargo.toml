[package]
name = "wayframe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wayframe-core = { path = "../wayframe-core" }
wayframe-runtime = { path = "../wayframe-runtime" }
wayframe-http = { path = "../wayframe-http", optional = true }
wayframe-blocks = { path = "../wayframe-blocks", optional = true }
wayframe-transport = { path = "../wayframe-transport", optional = true }
wayframe-mcp = { path = "../wayframe-mcp", optional = true }
wayframe-wasm = { path = "../wayframe-wasm", optional = true }

[features]
default = []
http = ["dep:wayframe-http"]
otel = ["http", "wayframe-http/otel"]
controls = ["http", "dep:wayframe-blocks"]
transport = ["http", "dep:wayframe-transport"]
mcp = ["http", "dep:wayframe-mcp"]
wasm = ["http", "dep:wayframe-wasm"]

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-util.workspace = true

[[example]]
name = "policy_cost"
required-features = ["http", "transport", "wasm"]
